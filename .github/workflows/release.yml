# Build, test and publish a release when a version tag (e.g. 0.1.0) is pushed.
# The assets get a signed build provenance attestation, so anyone can check that
# main.js was built here from the tagged source:
#   gh attestation verify main.js -R chaxic/obsidian-email-task-tracker
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build # includes the network guard

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "**In development: subject to change.** Export your records to CSV before updating."
            echo
            awk -v tag="$TAG" '$0 ~ "^## "tag"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md
          } > notes.md
          gh release create "$TAG" main.js manifest.json styles.css --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
